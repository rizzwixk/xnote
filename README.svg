<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 3200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="3200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="350" ry="200" fill="#ffffff" opacity="0.03" filter="url(#blur1)"/>
  <ellipse cx="200" cy="1600" rx="300" ry="250" fill="#ffffff" opacity="0.02" filter="url(#blur1)"/>
  <ellipse cx="700" cy="2400" rx="250" ry="200" fill="#ffffff" opacity="0.02" filter="url(#blur1)"/>

  <!-- Hero -->
  <text x="450" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">xnote</text>
  <text x="450" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#666666" text-anchor="middle" letter-spacing="6" text-transform="uppercase">LOCAL AI NOTES APP</text>
  <line x1="380" y1="190" x2="520" y2="190" stroke="#333333" stroke-width="1"/>

  <!-- What is it -->
  <text x="450" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#888888" text-anchor="middle">A minimal, private notes app with built-in AI that runs</text>
  <text x="450" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#888888" text-anchor="middle">entirely on your machine. No cloud. No accounts. No tracking.</text>

  <!-- Divider -->
  <line x1="100" y1="360" x2="800" y2="360" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: How it works -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">HOW IT WORKS</text>
  <text x="100" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e0e0e0">Three layers. Zero internet.</text>

  <!-- Architecture diagram -->
  <!-- Layer 1: Electron -->
  <rect x="100" y="510" width="700" height="80" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="140" y="545" font-family="monospace" font-size="13" font-weight="700" fill="#e0e0e0">ELECTRON RENDERER</text>
  <text x="140" y="570" font-family="monospace" font-size="11" fill="#666666">index.html + app.js + styles.css — your UI, themes, context menu</text>

  <!-- Arrow -->
  <line x1="450" y1="595" x2="450" y2="625" stroke="#444444" stroke-width="1.5"/>
  <polygon points="445,625 450,635 455,625" fill="#444444"/>

  <!-- Layer 2: Main Process -->
  <rect x="100" y="640" width="700" height="80" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="140" y="675" font-family="monospace" font-size="13" font-weight="700" fill="#e0e0e0">ELECTRON MAIN PROCESS</text>
  <text x="140" y="700" font-family="monospace" font-size="11" fill="#666666">main.js — IPC handlers, file I/O, spawns llama.cpp server</text>

  <!-- Arrow -->
  <line x1="450" y1="725" x2="450" y2="755" stroke="#444444" stroke-width="1.5"/>
  <polygon points="445,755 450,765 455,755" fill="#444444"/>

  <!-- Layer 3: llama.cpp -->
  <rect x="100" y="780" width="700" height="80" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="140" y="815" font-family="monospace" font-size="13" font-weight="700" fill="#e0e0e0">LLAMA.CPP SERVER</text>
  <text x="140" y="840" font-family="monospace" font-size="11" fill="#666666">127.0.0.1:8080 — local inference via Granite 4.0 Hybrid Mamba 350M</text>

  <!-- Divider -->
  <line x1="100" y1="910" x2="800" y2="910" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: Features -->
  <text x="100" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">FEATURES</text>

  <!-- Feature 1: Notes -->
  <rect x="100" y="1010" width="340" height="160" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="100" y="1010" width="340" height="4" rx="2" fill="#e0e0e0"/>
  <text x="140" y="1050" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0e0e0">Notes</text>
  <text x="140" y="1075" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Create, edit, delete notes</text>
  <text x="140" y="1095" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Auto-save on every keystroke</text>
  <text x="140" y="1115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">JSON storage in appData</text>
  <text x="140" y="1135" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Sidebar with live preview</text>
  <text x="140" y="1155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Right-click context menu</text>

  <!-- Feature 2: AI -->
  <rect x="460" y="1010" width="340" height="160" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="460" y="1010" width="340" height="4" rx="2" fill="#e0e0e0"/>
  <text x="500" y="1050" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0e0e0">AI</text>
  <text x="500" y="1075" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Spell check via local LLM</text>
  <text x="500" y="1095" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Auto format suggestions</text>
  <text x="500" y="1115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Auto title generation</text>
  <text x="500" y="1135" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Granite 4.0 Hybrid 350M</text>
  <text x="500" y="1155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Bundled — no download needed</text>

  <!-- Feature 3: Themes -->
  <rect x="100" y="1190" width="340" height="160" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="100" y="1190" width="340" height="4" rx="2" fill="#e0e0e0"/>
  <text x="140" y="1230" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0e0e0">Themes</text>
  <text x="140" y="1255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Dark — grayscale</text>
  <text x="140" y="1275" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Forest — green accent</text>
  <text x="140" y="1295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Ivory — warm light</text>
  <text x="140" y="1315" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Sky — blue light</text>
  <text x="140" y="1335" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Instant switch from settings</text>

  <!-- Feature 4: UI -->
  <rect x="460" y="1190" width="340" height="160" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="460" y="1190" width="340" height="4" rx="2" fill="#e0e0e0"/>
  <text x="500" y="1230" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0e0e0">UI</text>
  <text x="500" y="1255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Custom frameless titlebar</text>
  <text x="500" y="1275" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Lucide SVG icons</text>
  <text x="500" y="1295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Elms Sans font (bundled)</text>
  <text x="500" y="1315" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Themed confirm dialogs</text>
  <text x="500" y="1335" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888888">Bold UI text</text>

  <!-- Divider -->
  <line x1="100" y1="1400" x2="800" y2="1400" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: AI Model -->
  <text x="100" y="1470" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">AI MODEL</text>
  <text x="100" y="1505" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e0e0e0">Granite 4.0 Hybrid Mamba</text>

  <!-- Model specs -->
  <rect x="100" y="1540" width="220" height="90" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="1580" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#e0e0e0" text-anchor="middle">350M</text>
  <text x="210" y="1605" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666" text-anchor="middle">PARAMETERS</text>

  <rect x="340" y="1540" width="220" height="90" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="1580" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#e0e0e0" text-anchor="middle">Q4_K_M</text>
  <text x="450" y="1605" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666" text-anchor="middle">QUANTIZATION</text>

  <rect x="580" y="1540" width="220" height="90" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="690" y="1580" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#e0e0e0" text-anchor="middle">212MB</text>
  <text x="690" y="1605" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666" text-anchor="middle">MODEL SIZE</text>

  <!-- Model description -->
  <text x="100" y="1680" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">Hybrid Mamba-attention architecture — faster inference, lower memory</text>
  <text x="100" y="1705" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">than traditional transformers. Runs on CPU via bundled llama.cpp.</text>

  <!-- Divider -->
  <line x1="100" y1="1760" x2="800" y2="1760" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: Quick Start -->
  <text x="100" y="1830" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">QUICK START</text>

  <rect x="100" y="1860" width="700" height="60" rx="8" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="140" y="1897" font-family="monospace" font-size="14" fill="#e0e0e0">$ npm install</text>

  <rect x="100" y="1935" width="700" height="60" rx="8" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="140" y="1972" font-family="monospace" font-size="14" fill="#e0e0e0">$ npm run dev</text>

  <text x="100" y="2040" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">Opens in development mode. AI server starts automatically.</text>

  <!-- Divider -->
  <line x1="100" y1="2090" x2="800" y2="2090" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: File Structure -->
  <text x="100" y="2160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">PROJECT STRUCTURE</text>

  <text x="100" y="2200" font-family="monospace" font-size="13" fill="#e0e0e0">xnote/</text>
  <text x="120" y="2225" font-family="monospace" font-size="12" fill="#666666">main.js</text>
  <text x="320" y="2225" font-family="monospace" font-size="12" fill="#555555">Electron main process, IPC, AI server</text>
  <text x="120" y="2248" font-family="monospace" font-size="12" fill="#666666">preload.js</text>
  <text x="320" y="2248" font-family="monospace" font-size="12" fill="#555555">Context bridge for renderer</text>
  <text x="120" y="2271" font-family="monospace" font-size="12" fill="#666666">renderer/</text>
  <text x="120" y="2294" font-family="monospace" font-size="12" fill="#666666">  index.html</text>
  <text x="320" y="2294" font-family="monospace" font-size="12" fill="#555555">App UI, context menu, dialogs</text>
  <text x="120" y="2317" font-family="monospace" font-size="12" fill="#666666">  app.js</text>
  <text x="320" y="2317" font-family="monospace" font-size="12" fill="#555555">Renderer logic, themes, AI calls</text>
  <text x="120" y="2340" font-family="monospace" font-size="12" fill="#666666">  styles.css</text>
  <text x="320" y="2340" font-family="monospace" font-size="12" fill="#555555">CSS variables, theme blocks</text>
  <text x="120" y="2363" font-family="monospace" font-size="12" fill="#666666">  fonts/</text>
  <text x="320" y="2363" font-family="monospace" font-size="12" fill="#555555">Elms Sans TTF (4 weights)</text>
  <text x="120" y="2386" font-family="monospace" font-size="12" fill="#666666">  assets/</text>
  <text x="320" y="2386" font-family="monospace" font-size="12" fill="#555555">SVG icons</text>
  <text x="120" y="2409" font-family="monospace" font-size="12" fill="#666666">ai/</text>
  <text x="320" y="2409" font-family="monospace" font-size="12" fill="#555555">llama-server.exe + model.gguf</text>

  <!-- Divider -->
  <line x1="100" y1="2460" x2="800" y2="2460" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: Tech Stack -->
  <text x="100" y="2530" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">TECH STACK</text>

  <!-- Tech pills -->
  <rect x="100" y="2560" width="100" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="150" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Electron</text>

  <rect x="215" y="2560" width="60" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="245" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">HTML</text>

  <rect x="290" y="2560" width="45" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="312" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">CSS</text>

  <rect x="350" y="2560" width="35" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="367" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">JS</text>

  <rect x="400" y="2560" width="110" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="455" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">llama.cpp</text>

  <rect x="525" y="2560" width="120" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="585" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Granite 4.0</text>

  <rect x="660" y="2560" width="100" height="32" rx="16" fill="none" stroke="#444444" stroke-width="1"/>
  <text x="710" y="2581" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Elms Sans</text>

  <!-- Divider -->
  <line x1="100" y1="2640" x2="800" y2="2640" stroke="#222222" stroke-width="1"/>

  <!-- SECTION: Privacy -->
  <text x="100" y="2710" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555555" letter-spacing="4" text-transform="uppercase">PRIVACY</text>
  <text x="100" y="2745" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e0e0e0">Your notes never leave your machine.</text>

  <text x="100" y="2785" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">No telemetry. No analytics. No cloud sync. No accounts.</text>
  <text x="100" y="2810" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">AI runs on localhost. Notes stored as JSON in your appData folder.</text>
  <text x="100" y="2835" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">The app works fully offline after install.</text>

  <!-- Divider -->
  <line x1="100" y1="2890" x2="800" y2="2890" stroke="#222222" stroke-width="1"/>

  <!-- Footer -->
  <text x="450" y="2960" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.08">xnote</text>
  <text x="450" y="3000" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#444444" text-anchor="middle">github.com/rizzwixk/xnote</text>
  <text x="450" y="3025" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#444444" text-anchor="middle">MIT License</text>

  <!-- Version badge -->
  <rect x="380" y="3060" width="140" height="28" rx="14" fill="none" stroke="#333333" stroke-width="1"/>
  <text x="450" y="3079" font-family="monospace" font-size="11" fill="#666666" text-anchor="middle">v1.3.0</text>
</svg>
